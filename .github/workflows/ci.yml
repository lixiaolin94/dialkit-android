name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew :dialkit:testDebugUnitTest :dialkit:lintRelease :dialkit-noop:lintRelease :dialkit-compose:lintRelease assembleRelease :samples:views:assembleMeasure publishToMavenLocal -PsignAllPublications=false
