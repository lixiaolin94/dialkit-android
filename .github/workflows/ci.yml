name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew :dialkit:testDebugUnitTest :dialkit:lintRelease :dialkit-noop:lintRelease :dialkit-compose:lintRelease assembleRelease :samples:views:assembleMeasure :dialkit:assembleDebugAndroidTest :samples:compose:assembleDebugAndroidTest publishToMavenLocal -PsignAllPublications=false

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages (CONTRIBUTING.md → Commits)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # After a force push the previous head may be gone; then check everything since the first release.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..$HEAD_SHA"; else RANGE="0.0.1..$HEAD_SHA"; fi
          python3 scripts/check-commits.py "$RANGE"
