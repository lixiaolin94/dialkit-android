org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The library pins an older stdlib explicitly so consumers on Kotlin 2.1 are not forced upward.
kotlin.stdlib.default.dependency=false

# ---- Publishing (com.vanniktech.maven.publish). Credentials and the signing key go in ~/.gradle/gradle.properties
# or ORG_GRADLE_PROJECT_* environment variables, never here: mavenCentralUsername / mavenCentralPassword
# (Central Portal user token) and signingInMemoryKey / signingInMemoryKeyPassword.
GROUP=io.github.lixiaolin94
VERSION_NAME=0.0.1
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=false
signAllPublications=true

POM_URL=https://github.com/lixiaolin94/dialkit-android
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/license/mit
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/lixiaolin94/dialkit-android
POM_SCM_CONNECTION=scm:git:git://github.com/lixiaolin94/dialkit-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/lixiaolin94/dialkit-android.git
